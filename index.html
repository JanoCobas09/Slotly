    <!-- PWA: instalable en el celular del dueño/staff, principalmente para
         que las notificaciones push (src/lib/push.js) funcionen con la app
         cerrada, no solo con la pestaña abierta. -->

    <meta name="theme-color" content="#171717" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Bienvenida al abrir la app INSTALADA (no en el navegador). La pantalla
         que Android muestra primero la arma el sistema con el manifest (ícono,
         nombre, background_color) y no admite animación ni sonido; esta va
         justo después, con el mismo fondo, así se ven como una sola intro.
         Vive acá y no en React para pintarse antes de que baje el bundle.
         React avisa cuándo está listo con window.__slotlySplashListo()
         (src/lib/splash.js); se va recién pasado el mínimo de la animación. -->
    <style>
      #splash { display: none; }
      html.con-splash #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: #171717;
        transition: opacity .45s ease, transform .45s ease;
      }
      html.con-splash body { background: #171717; }
      #splash.sp-saliendo { opacity: 0; transform: scale(1.06); pointer-events: none; }
      .sp-centro { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: -4vh; }
      .sp-halo {
        position: absolute; top: 58px; left: 50%; width: 280px; height: 280px;
        margin: -140px 0 0 -140px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,255,255,.13), rgba(255,255,255,0));
        opacity: 0; transform: scale(.6);
        animation: sp-halo 1.3s .35s ease-out forwards;
      }
      .sp-glifo { position: relative; width: 132px; height: 117px; overflow: visible; }
      .sp-barra {
        transform-box: fill-box; transform-origin: left center;
        transform: scaleX(0); opacity: 0;
        animation: sp-barra .55s cubic-bezier(.2, 1.5, .45, 1) forwards;
      }
      .sp-barra:nth-child(1) { animation-delay: .15s; }
      .sp-barra:nth-child(2) { animation-delay: .27s; }
      .sp-barra:nth-child(3) { animation-delay: .39s; }
      .sp-marca {
        position: relative; width: 132px; height: auto;
        opacity: 0; transform: translateY(10px); filter: blur(6px);
        animation: sp-marca .6s .62s cubic-bezier(.2, .8, .3, 1) forwards;
      }
      @keyframes sp-barra { 0% { transform: scaleX(0); opacity: 0; } 35% { opacity: 1; } 100% { transform: scaleX(1); opacity: 1; } }
      @keyframes sp-marca { to { opacity: 1; transform: none; filter: none; } }
      @keyframes sp-halo { 40% { opacity: 1; } 100% { opacity: .55; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        .sp-barra, .sp-marca, .sp-halo { animation: none; opacity: 1; transform: none; filter: none; }
        #splash { transition: opacity .2s ease; }
        #splash.sp-saliendo { transform: none; }
      }
    </style>
    <script>
      (function () {
        var MINIMO_MS = 1500;   // lo que dura la animación entera
        var TOPE_MS = 7000;     // si React nunca avisa, no tapar la app para siempre
        var inicio = performance.now();
        var standalone = false;
        try {
          standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        } catch (e) { /* navegador viejo: sin bienvenida */ }
        // Una vez por apertura: arrastrar para recargar no la repite.
        var yaVista = false;
        try { yaVista = sessionStorage.getItem('slotly:splashVisto') === '1'; } catch (e) { /* nada */ }
        var mostrar = standalone && !yaVista;

        var listo = false;
        window.__slotlySplashListo = function () {
          if (listo) return;
          listo = true;
          var el = document.getElementById('splash');
          if (!el) return;
          if (!mostrar) { el.remove(); return; }
          setTimeout(function () {
            el.classList.add('sp-saliendo');
            setTimeout(function () {
              el.remove();
              document.documentElement.classList.remove('con-splash');
            }, 460);
          }, Math.max(0, MINIMO_MS - (performance.now() - inicio)));
        };

        if (!mostrar) return;
        try { sessionStorage.setItem('slotly:splashVisto', '1'); } catch (e) { /* nada */ }
        document.documentElement.classList.add('con-splash');
        setTimeout(window.__slotlySplashListo, TOPE_MS);

        // Sonido: tres notas suaves (do-mi-sol), una por barra que llega.
        // Sintetizado (no hay archivo que bajar). Android deja sonar sin un
        // toque previo a las apps instaladas en la pantalla de inicio; donde
        // no lo permite (iPhone), el contexto queda suspendido y no suena —
        // nunca se reproduce tarde, al primer toque. Se apaga desde el menú
        // del panel ("Sonido al abrir", clave slotly:sonidoAlAbrir).
        try { if (localStorage.getItem('slotly:sonidoAlAbrir') === 'off') return; } catch (e) { /* nada */ }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx;
        try { ctx = new AC(); } catch (e) { return; }
        var cerrar = function () { try { ctx.close(); } catch (e) { /* nada */ } };
        var NOTAS = [[1046.5, .42], [1318.5, .54], [1568, .66]]; // [Hz, segundo de la animación]
        var tocar = function () {
          var transcurrido = (performance.now() - inicio) / 1000;
          var salida = ctx.createGain();
          salida.gain.value = .9;
          salida.connect(ctx.destination);
          NOTAS.forEach(function (n, i) {
            var t = ctx.currentTime + n[1] - transcurrido;
            if (t < ctx.currentTime) return;
            var dur = i === NOTAS.length - 1 ? 1.1 : .7;
            // Fundamental + dos armónicos que se apagan antes: suena a
            // campanita y no a pitido.
            [[1, .13], [2, .025], [3, .012]].forEach(function (armonico) {
              var osc = ctx.createOscillator();
              var vol = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.value = n[0] * armonico[0];
              vol.gain.setValueAtTime(0, t);
              vol.gain.linearRampToValueAtTime(armonico[1], t + .008);
              vol.gain.exponentialRampToValueAtTime(.0001, t + dur / armonico[0]);
              osc.connect(vol);
              vol.connect(salida);
              osc.start(t);
              osc.stop(t + dur);
            });
          });
          setTimeout(cerrar, 2500);
        };
        if (ctx.state === 'running') { tocar(); return; }
        // Sin permiso para sonar, resume() queda pendiente hasta el primer
        // toque: pasados 300 ms ya llega tarde y se descarta.
        var resuelto = false;
        ctx.resume().then(function () {
          if (resuelto) return;
          resuelto = true;
          if (ctx.state === 'running') tocar(); else cerrar();
        }, function () { resuelto = true; cerrar(); });
        setTimeout(function () { if (!resuelto) { resuelto = true; cerrar(); } }, 300);
      })();
    </script>
  </head>
